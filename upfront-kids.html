<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Adventures — Upfront Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Baloo 2',sans-serif;
    background:linear-gradient(160deg,#2a63c9,#0f2b5c);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    -webkit-tap-highlight-color:transparent;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:min(1000px, calc((100vh - 32px) * 1.5));
    max-width:min(1000px, calc((100dvh - 32px) * 1.5));
    aspect-ratio:1536/1024;
    margin:0 auto;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    background:#0f2b5c;
  }
  @media(max-width:640px){
    body{padding:0}
    .stage{
      border-radius:0;box-shadow:none;aspect-ratio:1536/1024;
      max-width:min(100%, calc(100vh * 1.5));
      max-width:min(100%, calc(100dvh * 1.5));
    }
  }

  .screen{
    position:absolute;inset:0;
    background-size:contain;background-repeat:no-repeat;background-position:center;
    display:none;
  }
  .screen.active{display:block;animation:screen-in .5s ease}
  @keyframes screen-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}

  .sparkle{
    position:absolute;pointer-events:none;
    font-size:clamp(14px,2.4vw,24px);
    animation:sparkle-float 2.6s ease-in-out infinite;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.8));
  }
  @keyframes sparkle-float{
    0%,100%{opacity:.15;transform:translateY(0) scale(.6) rotate(0deg)}
    50%{opacity:1;transform:translateY(-10px) scale(1.2) rotate(20deg)}
  }
  /* gentle up/down float for decorative (non-activity) elements */
  .float-badge{
    position:absolute;pointer-events:none;
    animation:float-badge 2.2s ease-in-out infinite;
  }
  @keyframes float-badge{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
  }

  /* ── celebration (Lesson complete) ─────────────────── */
  .confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
  .confetti-piece{
    position:absolute;top:-8%;width:1.4%;height:2.2%;
    opacity:.95;animation-name:confetti-fall;animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{top:-8%;opacity:1}
    85%{opacity:1}
    100%{top:108%;opacity:.3}
  }
  .celebrate-emoji{
    position:absolute;pointer-events:none;
    font-size:clamp(20px,4vw,36px);
    opacity:0;transform:scale(.3) rotate(-15deg);
    animation:celebrate-pop 1s cubic-bezier(.34,1.56,.64,1) forwards,
              celebrate-bob 2.4s ease-in-out 1s infinite;
  }
  @keyframes celebrate-pop{
    to{opacity:1;transform:scale(1) rotate(0deg)}
  }
  @keyframes celebrate-bob{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-10px) rotate(4deg)}
  }

  /* ── transparent hotspot buttons ───────────────────── */
  .hot{
    position:absolute;
    border:none;background:transparent;
    padding:0;margin:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    outline:none;
    -webkit-appearance:none;
  }
  .hot:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.85);border-radius:999px}
  .hot.pulse{animation:pulse .4s ease}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  .hot.ok{box-shadow:0 0 0 3px #22c55e inset;border-radius:999px;background:rgba(34,197,94,.15)}
  .hot.bad{animation:shake .4s ease;box-shadow:0 0 0 3px #ef4444 inset;border-radius:999px;background:rgba(239,68,68,.15)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .hot.sel{box-shadow:0 0 0 4px #ffcc00 inset;border-radius:999px}

  /* memory cards */
  .mem-card{
    border-radius:12%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;
  }
  .mem-card .mem-img{
    width:60%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;
    opacity:0;transform:scale(.6);transition:all .25s ease;
    margin-bottom:2%;pointer-events:none;
  }
  .mem-card .mem-face{
    opacity:0;transform:scale(.7);
    transition:all .25s ease;
    font-weight:800;font-size:clamp(9px,2.2vw,16px);
    color:#5b21b6;text-align:center;padding:0 4px;pointer-events:none;
  }
  .mem-card.flip,.mem-card.matched{
    background:rgba(255,255,255,.95);
    box-shadow:0 0 0 3px #7c3aed inset;
    border-radius:12%;
  }
  .mem-card.matched{box-shadow:0 0 0 3px #22c55e inset;background:rgba(220,255,230,.95)}
  .mem-card.flip .mem-img,.mem-card.matched .mem-img{opacity:1;transform:scale(1)}
  .mem-card.flip .mem-face,.mem-card.matched .mem-face{opacity:1;transform:scale(1)}
  .mem-card.listening-lock{pointer-events:none}

  /* ── unscramble tiles (step 7, overlaid on the real artwork) ── */
  .unscr-sentence,.unscr-bank{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    gap:2.5%;flex-wrap:wrap;padding:1%;
  }
  .unscr-slot-chip,.unscr-tile{
    border-radius:12px;font-family:inherit;font-weight:800;
    font-size:clamp(12px,2.2vw,18px);padding:3% 5%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .12s;
  }
  .unscr-slot-chip:active,.unscr-tile:active{transform:scale(.94)}
  .unscr-slot-chip{background:#4189ff;color:#fff;border:none;box-shadow:0 4px 8px rgba(0,0,0,.15)}
  .unscr-tile{background:#fff;color:#1e3a5f;border:3px solid #4189ff;box-shadow:0 3px 6px rgba(0,0,0,.1)}
  .unscr-slot-empty{
    display:inline-block;width:20%;height:55%;
    border:3px dashed #b9c4dd;border-radius:12px;
  }

  /* ── toast ──────────────────────────────────────────── */
  .toast{
    position:absolute;left:50%;top:6%;transform:translate(-50%,-20px);
    background:#1a1a2e;color:#fff;font-weight:700;
    padding:10px 22px;border-radius:999px;
    font-size:clamp(12px,2.4vw,16px);
    opacity:0;pointer-events:none;transition:all .25s ease;
    z-index:50;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ── settings modal ─────────────────────────────────── */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(10,14,30,.72);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex}
  .modal-box{
    background:#fff;border-radius:24px;padding:22px;max-width:320px;width:100%;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box h3{font-size:clamp(16px,3.4vw,20px);color:#1e293b;margin-bottom:14px}
  .modal-btn{
    display:block;width:100%;padding:12px;margin-top:10px;
    border:none;border-radius:14px;font-family:inherit;font-weight:700;
    font-size:clamp(13px,2.8vw,15px);cursor:pointer;color:#fff;
  }
  .modal-btn.blue{background:#2563eb}
  .modal-btn.green{background:#16a34a}
  .modal-btn.gray{background:#64748b}

  .hint{
    position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
    color:#fff;font-weight:800;font-size:clamp(14px,3vw,20px);
    text-shadow:0 2px 10px rgba(0,0,0,.6);
    background:rgba(15,20,50,.55);padding:6px 16px;border-radius:999px;
    animation:bob 1.4s ease-in-out infinite;pointer-events:none;
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
</style>
</head>

// ═══ CELEBRATION (confetti + emoji burst + chime sound) ═══
const CONFETTI_COLORS = ['#ff5d8f','#ffcc00','#22c55e','#4189ff','#a259ff','#ff8a3d'];
const CELEBRATE_EMOJI = ['🎉','⭐','🌟','✨','🎊','🏆'];
let celebrateBusy = false;
function spawnConfetti(){
  const layer = document.getElementById('confettiLayer');
  if(!layer) return;
  layer.innerHTML = '';
  const count = 36;
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100) + '%';
    p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    p.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    p.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    p.style.animationDelay = (Math.random()*0.6) + 's';
    p.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    layer.appendChild(p);
  }
  const emojiCount = 5;
  for(let i=0;i<emojiCount;i++){
    const e = document.createElement('span');
    e.className = 'celebrate-emoji';
    e.textContent = CELEBRATE_EMOJI[Math.floor(Math.random()*CELEBRATE_EMOJI.length)];
    e.style.left = (10 + Math.random()*80) + '%';
    e.style.top = (6 + Math.random()*18) + '%';
    e.style.animationDelay = (Math.random()*0.5) + 's, ' + (0.9 + Math.random()*0.4) + 's';
    layer.appendChild(e);
  }
  setTimeout(()=>{ layer.innerHTML=''; }, 3600);
}
// Short cheerful chime via Web Audio — no sound files or voices needed,
// so it always plays even where speech synthesis is blocked or muted.
let audioCtx = null;
function playChime(){
  if(muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    const start = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = start + i * 0.11;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.36);
    });
  }catch(e){}
}
function celebrate(message, force){
  if(celebrateBusy && !force) return;
  celebrateBusy = true;
  spawnConfetti();
  playChime();
  if(message) toast(message, 2200);
  setTimeout(()=>{ celebrateBusy = false; }, 400);
}

// ═══ AUDIO (Web Speech API) ═══
let muted = localStorage.getItem('kids_muted') === '1';
let ttsVoices = [];
let ttsWarned = false;
let ttsPrimed = false;
// Voices whose names tend to sound brighter/younger across common platforms,
// checked in order — first match wins. Falls back to any English voice.
const FRIENDLY_VOICE_HINTS = [
  'female child','child','junior','samantha','karen','moira','tessa',
  'google uk english female','google us english','zira','susan','kids',
  'female'
];
function loadVoices(){
  if('speechSynthesis' in window) ttsVoices = window.speechSynthesis.getVoices();
}
function pickFriendlyVoice(){
  const en = ttsVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if(!en.length) return null;
  for(const hint of FRIENDLY_VOICE_HINTS){
    const found = en.find(v => v.name.toLowerCase().includes(hint));
    if(found) return found;
  }
  return en[0];
}
function primeSpeech(){
  if(ttsPrimed || !('speechSynthesis' in window)) return;
  ttsPrimed = true;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  document.addEventListener('pointerdown', primeSpeech, { once:true, capture:true });
}
function speak(text, rate){
  if(muted) return;
  if(!('speechSynthesis' in window)){
    if(!ttsWarned){ toast('🔇 Voice not supported in this browser'); ttsWarned = true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.9;
    u.pitch = 1.35;
    const v = pickFriendlyVoice();
    if(v) u.voice = v;
    u.onerror = function(){ if(!ttsWarned){ toast('🔇 Audio blocked — open in Chrome or Safari'); ttsWarned = true; } };
    window.speechSynthesis.speak(u);
  }catch(e){
    if(!ttsWarned){ toast('🔇 Audio error on this device'); ttsWarned = true; }
  }
}

// ═══ TOAST ═══
let toastTimer = null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms || 1600);
}

const vocabHeard = new Set();
function playWord(word, el){

// ═══ STEP 3 · MATCHING ═══
let matchLeftSel = null;
const matchedSet = new Set();
function matchLeftClick(key, el){
  if(matchedSet.has(key)) return;
  document.querySelectorAll('.match-left').forEach(e=>e.classList.remove('sel'));
  matchLeftSel = key;
  el.classList.add('sel');
}
function matchRightClick(key, el){
  if(!matchLeftSel || matchedSet.has(key)) return;
  const leftEl = document.querySelector('.match-left[data-key="'+matchLeftSel+'"]');
  if(matchLeftSel === key){
    matchedSet.add(key);
    leftEl.classList.remove('sel');
    leftEl.classList.add('ok');
    el.classList.add('ok');
    speak(key.charAt(0).toUpperCase()+key.slice(1)+'!');
    if(matchedSet.size === 3) celebrate('🌟 Great matching!');
  } else {
    el.classList.add('bad');
    leftEl.classList.add('bad');
    setTimeout(()=>{ el.classList.remove('bad'); leftEl.classList.remove('bad','sel'); }, 500);
  }
  matchLeftSel = null;
}

function chooseAnswer(correct, el, word){

    el.classList.add('ok');

  }
}

// ═══ STEP 5 · LET'S SPEAK ═══
function tapToSpeak(el, expected){
  expected = expected || 'hello';
  el.classList.add('pulse');
  toast('🎤 Listening...', 1000);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    try{
      const rec = new SR();
      rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = (e)=>{
        const said = (e.results[0][0].transcript || '').toLowerCase();
        if(said.includes(expected)){ celebrate('⭐ Perfect!'); speak('Great job!'); }
        else { toast('🙂 Try again!'); }
      };
      rec.onerror = ()=>{ celebrate('⭐ Great job!'); speak('Great job!'); };
      rec.start();
      return;
    }catch(e){ /* fall through to simulation */ }
  }
  setTimeout(()=>{ celebrate('⭐ Great job!'); speak('Great job!'); }, 900);
}

// ═══ STEP 6 · MEMORY ═══
const MEMORY_PAIRS = [
  {word:'Hello',   face:'kids-assets/face-leo.jpg'},
  {word:'Hi',      face:'kids-assets/face-mia.jpg'},
  {word:'Goodbye', face:'kids-assets/face-buddy.jpg'},
  {word:'Bye',     face:'kids-assets/face-luna.jpg'}
];
let memoryDeck = [];
let memoryFlipped = [];
let memoryLock = false;
function initMemory(){
  memoryDeck = MEMORY_PAIRS.concat(MEMORY_PAIRS);
  for(let i=memoryDeck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [memoryDeck[i],memoryDeck[j]] = [memoryDeck[j],memoryDeck[i]];
  }
  memoryFlipped = [];
  memoryLock = false;
  document.querySelectorAll('.mem-card').forEach((c,i)=>{
    c.classList.remove('flip','matched');
    c.dataset.word = memoryDeck[i].word;
    c.querySelector('.mem-face').textContent = memoryDeck[i].word;
    c.querySelector('.mem-img').src = memoryDeck[i].face;
  });
}
function flipMemCard(idx, el){
  if(memoryLock || el.classList.contains('flip') || el.classList.contains('matched')) return;
  el.classList.add('flip');
  memoryFlipped.push({idx, el, word: memoryDeck[idx].word});
  if(memoryFlipped.length === 2){
    memoryLock = true;
    const [a,b] = memoryFlipped;
    if(a.word === b.word && a.idx !== b.idx){
      a.el.classList.add('matched'); b.el.classList.add('matched');
      speak(a.word);
      memoryFlipped = [];
      memoryLock = false;
      if(document.querySelectorAll('.mem-card.matched').length === 8){
        setTimeout(()=>celebrate('🏆 You found them all!'), 300);
      }
    } else {
      setTimeout(()=>{
        a.el.classList.remove('flip'); b.el.classList.remove('flip');
        memoryFlipped = []; memoryLock = false;
      }, 800);
    }
  }
}

}

// ═══ STEP 7 · UNSCRAMBLE ═══
const UNSCRAMBLE_DATA = {
  l1_7d: ['Hello','Buddy','!'],
  l1_7e: ['Hi','Mia','!'],
  l1_7f: ['Goodbye','Luna','!']
};
const unscrambleState = {};
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function initUnscramble(id){
  const answer = UNSCRAMBLE_DATA[id];
  let bank = answer.slice();
  do{ shuffleArr(bank); } while(bank.join('') === answer.join(''));
  unscrambleState[id] = { answer, slots: new Array(answer.length).fill(null), bank, locked:false };
  renderUnscramble(id);
}
function renderUnscramble(id){
  const st = unscrambleState[id];
  const slotsEl = document.getElementById(id+'_slots');
  const bankEl = document.getElementById(id+'_bank');
  if(!slotsEl || !bankEl) return;
  slotsEl.innerHTML = st.slots.map((w,i)=> w
    ? '<button class="unscr-slot-chip" onclick="unscrRemove(\''+id+'\','+i+')">'+w+'</button>'
    : '<span class="unscr-slot-empty"></span>'
  ).join('');
  bankEl.innerHTML = st.bank.map((w,i)=>
    '<button class="unscr-tile" onclick="unscrPlace(\''+id+'\','+i+')">'+w+'</button>'
  ).join('');
}
function unscrPlace(id, bankIdx){
  const st = unscrambleState[id];
  if(!st || st.locked) return;
  const emptyIdx = st.slots.findIndex(s=>s===null);
  if(emptyIdx === -1) return;
  const word = st.bank.splice(bankIdx,1)[0];
  st.slots[emptyIdx] = word;
  renderUnscramble(id);
  if(st.slots.every(s=>s!==null)) checkUnscramble(id);
}
function unscrRemove(id, slotIdx){
  const st = unscrambleState[id];
  if(!st || st.locked) return;
  const word = st.slots[slotIdx];
  if(!word) return;
  st.slots[slotIdx] = null;
  st.bank.push(word);
  renderUnscramble(id);
}
function checkUnscramble(id){
  const st = unscrambleState[id];
  const correct = st.slots.join('|') === st.answer.join('|');
  if(correct){
    st.locked = true;
    speak(st.answer.join(' '));
    celebrate('🌟 Perfect sentence!');
  } else {
    toast('🙂 Try again!');
    setTimeout(()=>{
      st.bank = st.bank.concat(st.slots.filter(Boolean));
      st.slots = new Array(st.answer.length).fill(null);
      renderUnscramble(id);
    }, 900);
  }
}

// ═══ STEP 8 · FINISH ═══
function finishLesson(){
  localStorage.setItem('kids_lesson1_done', '1');
  toast('🎉 Lesson 1 complete!');
  setTimeout(()=>showScreen('map'), 900);
}
